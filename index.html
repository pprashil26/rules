<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102a43"><title>Life Rules</title>
<style>
:root{--navy:#102a43;--bg:#f4f7f9;--text:#172b3a;--muted:#718096;--line:#dfe7ec;--soft:#eaf1f5;--danger:#b42318}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input,select,textarea{font:inherit}.app{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:78px}.head{height:46px;padding:0 12px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top);z-index:5}.brand{font-size:15px;font-weight:800;letter-spacing:.06em}.icon{border:0;background:transparent;color:inherit;width:44px;height:44px;font-size:19px}.tabs{height:40px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line)}.tab{border:0;background:none;color:#7b8794;font-size:12px;font-weight:800;letter-spacing:.04em;position:relative}.tab.on{color:var(--navy)}.tab.on:after{content:"";position:absolute;bottom:0;height:2px;left:24%;right:24%;background:var(--navy)}.filters{height:34px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:3px 12px}.filter{border:0;background:transparent;color:#697886;padding:5px 10px;border-radius:12px;font-size:11px;font-weight:700}.filter.on{background:var(--soft);color:var(--navy)}#list{background:#fff}.row{min-height:50px;padding:6px 12px;display:grid;grid-template-columns:18px 1fr 18px;align-items:center;border-bottom:1px solid #edf1f3}.star{color:#b07b16;font-size:13px;text-align:center}.title{font-size:14px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:2px}.note{font-size:10px;color:#8a97a3;font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:#9aa6af;text-align:right}.empty{text-align:center;padding:54px 24px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:28px}.overlay{position:fixed;inset:0;background:#071b2b70;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.overlay.open{display:flex}.sheet{width:min(100%,520px);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:16px;padding:10px 12px 12px}.sh{display:flex;align-items:center;justify-content:space-between;height:36px}.sh h2{font-size:13px;letter-spacing:.05em;margin:0;color:var(--navy)}label{display:block;font-size:11px;font-weight:700;color:#566675;margin:7px 0 3px}input,select,textarea{width:100%;border:1px solid #ccd7de;border-radius:9px;background:#fff;color:var(--text);padding:8px 9px;font-size:13px}#itemTitle{font-weight:800;text-transform:uppercase}textarea{min-height:52px;resize:vertical}.check{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px;font-weight:600}.check input{width:16px}.actions{display:flex;align-items:center;gap:7px;margin-top:10px}.actions .spacer{flex:1}.btn{border:1px solid #cbd7df;background:#fff;color:var(--navy);border-radius:9px;min-height:36px;padding:7px 12px;font-size:12px;font-weight:700}.primary{background:var(--navy);color:#fff}.danger{color:var(--danger);border-color:transparent}.setting{min-height:42px;border-top:1px solid #edf1f3;display:flex;align-items:center;justify-content:space-between;font-size:13px}.section{font-size:10px;font-weight:800;color:#7a8792;margin:12px 0 4px}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#203846;color:white;padding:8px 12px;border-radius:18px;font-size:11px;display:none}.toast.show{display:block}
</style></head><body>
<main class="app"><header class="head"><div class="brand">LIFE RULES</div><button class="icon" id="settingsBtn">⚙</button></header><nav class="tabs"><button class="tab on" data-view="rules">RULES</button><button class="tab" data-view="routines">ROUTINES</button></nav><div class="filters"><button class="filter" data-filter="all">All</button><button class="filter on" data-filter="active">Active</button><button class="filter" data-filter="paused">Paused</button></div><section id="list"></section></main><button class="fab" id="addBtn">+</button>
<div class="overlay" id="editOverlay"><form class="sheet" id="editForm"><div class="sh"><h2 id="editTitle"></h2><button type="button" class="icon" id="closeEdit">×</button></div><label id="titleLabel"></label><input id="itemTitle" required maxlength="160" autocomplete="off"><div id="routineFields" hidden><label>Frequency</label><input id="frequency" value="Daily"><label>When</label><input id="when" placeholder="10:00 PM, Morning, Before bed"></div><label>Category</label><input id="category" value="Personal"><div id="statusWrap" hidden><label>Status</label><select id="status"><option value="active">Active</option><option value="paused">Paused</option></select></div><label class="check"><input type="checkbox" id="pinned"> Core / Pinned</label><label>Notes</label><textarea id="notes" placeholder="Optional"></textarea><div class="actions"><button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button><span class="spacer"></span><button type="button" class="btn" id="cancelEdit">Cancel</button><button class="btn primary" type="submit" id="saveBtn">Add</button></div></form></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="sh"><h2>SETTINGS</h2><button class="icon" id="closeSettings">×</button></div><div class="section">DATA</div><div class="setting"><span>Backup</span><button class="btn" id="backupBtn">Backup</button></div><div class="setting"><span>Restore</span><button class="btn" id="restoreBtn">Restore</button><input type="file" id="restoreFile" accept=".json" hidden></div><div class="section">DISPLAY</div><div class="setting"><span>Default view</span><select id="defaultView"><option value="rules">Rules</option><option value="routines">Routines</option></select></div><div class="setting"><span>Show paused by default</span><input type="checkbox" id="showPaused" style="width:18px"></div><div class="section">ABOUT</div><div class="setting"><span>Life Rules</span><strong>Version 1.0.2</strong></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';const DB_NAME='LifeRulesDB',DB_VERSION=1;let db,view='rules',filter='active',editingId=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function rp(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}function td(t){return new Promise((a,b)=>{t.oncomplete=a;t.onerror=()=>b(t.error);t.onabort=()=>b(t.error)})}async function openDB(){return new Promise((a,b)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{let d=e.target.result;for(let n of ['rules','routines'])if(!d.objectStoreNames.contains(n)){let s=d.createObjectStore(n,{keyPath:'id'});['category','status','pinned','updatedAt'].forEach(k=>s.createIndex(k,k))}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function all(s){return rp(db.transaction(s).objectStore(s).getAll())}async function one(s,id){return rp(db.transaction(s).objectStore(s).get(id))}async function put(s,o){let t=db.transaction(s,'readwrite');t.objectStore(s).put(o);await td(t)}async function del(s,id){let t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);await td(t)}async function setting(k,d){let x=await one('settings',k);return x?x.value:d}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function render(){let xs=(await all(view)).filter(x=>filter==='all'||x.status===filter).sort((a,b)=>a.pinned!==b.pinned?(a.pinned?-1:1):a.title.localeCompare(b.title));if(!xs.length){$('#list').innerHTML='<div class="empty"><strong>No '+view+' yet.</strong>Use + to add one.</div>';return}$('#list').innerHTML=xs.map(x=>'<div class="row" data-id="'+esc(x.id)+'"><div class="star">'+(x.pinned?'★':'')+'</div><div><div class="title">'+esc(x.title)+'</div><div class="meta">'+esc(view==='rules'?(x.category||'Personal'):((x.frequency||'')+(x.frequency&&x.when?' · ':'')+(x.when||''))+(x.status==='paused'?' · Paused':''))+'</div>'+(x.notes?'<div class="note">'+esc(x.notes)+'</div>':'')+'</div><div class="chev">›</div></div>').join('');$$('.row').forEach(r=>r.onclick=()=>editor(r.dataset.id))}function nav(){$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.view===view));$$('.filter').forEach(x=>x.classList.toggle('on',x.dataset.filter===filter))}async function editor(id=null){editingId=id;let rout=view==='routines';$('#editForm').reset();$('#routineFields').hidden=!rout;$('#statusWrap').hidden=!id;$('#deleteBtn').hidden=!id;$('#editTitle').textContent=(id?'EDIT ':'ADD ')+(rout?'ROUTINE':'RULE');$('#titleLabel').textContent=rout?'Routine':'Rule';$('#saveBtn').textContent=id?'Save':'Add';$('#category').value='Personal';$('#frequency').value='Daily';if(id){let x=await one(view,id);$('#itemTitle').value=x.title||'';$('#category').value=x.category||'Personal';$('#pinned').checked=!!x.pinned;$('#status').value=x.status||'active';$('#notes').value=x.notes||'';if(rout){$('#frequency').value=x.frequency||'';$('#when').value=x.when||''}}$('#editOverlay').classList.add('open');setTimeout(()=>$('#itemTitle').focus(),40)}function closeEdit(){$('#editOverlay').classList.remove('open');editingId=null}$('#editForm').onsubmit=async e=>{e.preventDefault();let title=$('#itemTitle').value.trim().toUpperCase();if(!title)return;let old=editingId?await one(view,editingId):null,now=Date.now(),o={id:old?.id||((view==='rules'?'rule_':'routine_')+crypto.randomUUID()),title,category:$('#category').value.trim()||'Personal',pinned:$('#pinned').checked,status:editingId?$('#status').value:'active',notes:$('#notes').value.trim(),createdAt:old?.createdAt||now,updatedAt:now};if(view==='routines'){o.frequency=$('#frequency').value.trim()||'Daily';o.when=$('#when').value.trim()}await put(view,o);closeEdit();await render();toast('Saved')};$('#deleteBtn').onclick=async()=>{if(editingId&&confirm('Delete this item?')){await del(view,editingId);closeEdit();render()}};$('#addBtn').onclick=()=>editor();$('#closeEdit').onclick=$('#cancelEdit').onclick=closeEdit;$$('.tab').forEach(x=>x.onclick=()=>{view=x.dataset.view;nav();render()});$$('.filter').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;nav();render()});$('#settingsBtn').onclick=async()=>{$('#defaultView').value=await setting('defaultView','rules');$('#showPaused').checked=await setting('showPaused',false);$('#settingsOverlay').classList.add('open')};$('#closeSettings').onclick=()=>$('#settingsOverlay').classList.remove('open');$('#defaultView').onchange=e=>put('settings',{key:'defaultView',value:e.target.value});$('#showPaused').onchange=e=>put('settings',{key:'showPaused',value:e.target.checked});$('#backupBtn').onclick=async()=>{let sa=await all('settings'),data={app:'Life Rules',version:1,exportedAt:new Date().toISOString(),rules:await all('rules'),routines:await all('routines'),settings:Object.fromEntries(sa.map(x=>[x.key,x.value]))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='life-rules-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='Life Rules'||d.version!==1||!Array.isArray(d.rules)||!Array.isArray(d.routines))throw 0;if(!confirm('Restore backup? This replaces current data.'))return;for(let s of ['rules','routines','settings']){let t=db.transaction(s,'readwrite');t.objectStore(s).clear();await td(t)}for(let x of d.rules)await put('rules',x);for(let x of d.routines)await put('routines',x);for(let [k,v] of Object.entries(d.settings||{}))await put('settings',{key:k,value:v});render();toast('Restored')}catch{alert('Invalid Life Rules V1 backup. No data was changed.')}};(async()=>{db=await openDB();view=await setting('defaultView','rules');filter=(await setting('showPaused',false))?'all':'active';nav();render()})();
</script></body></html>
