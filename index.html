<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#102a43"><title>Life Rules</title>
<style>
:root{--navy:#102a43;--navy2:#173f5f;--bg:#f4f7f9;--card:#fff;--text:#172b3a;--muted:#718096;--line:#dfe7ec;--soft:#eaf1f5;--danger:#b42318;--r:12px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input,select,textarea{font:inherit}.app{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:78px}.head{height:46px;padding:0 12px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top);z-index:5}.brand{font-size:15px;font-weight:800;letter-spacing:.06em}.icon{border:0;background:transparent;color:inherit;width:44px;height:44px;font-size:19px;cursor:pointer}.tabs{height:40px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top) + 46px);z-index:4}.tab{border:0;background:none;color:#7b8794;font-size:12px;font-weight:800;letter-spacing:.04em;position:relative}.tab.on{color:var(--navy)}.tab.on:after{content:"";position:absolute;bottom:0;height:2px;left:24%;right:24%;background:var(--navy);border-radius:2px}.filters{height:34px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:3px 12px;position:sticky;top:calc(env(safe-area-inset-top) + 86px);z-index:3}.filter{border:0;background:transparent;color:#697886;padding:5px 10px;border-radius:12px;font-size:11px;font-weight:700}.filter.on{background:var(--soft);color:var(--navy)}#list{background:#fff}.row{min-height:50px;padding:6px 12px;display:grid;grid-template-columns:18px 1fr 18px;align-items:center;border-bottom:1px solid #edf1f3;cursor:pointer}.star{color:#b07b16;font-size:13px;text-align:center}.title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:#9aa6af;text-align:right}.empty{text-align:center;padding:54px 24px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}.empty button{margin-top:14px}.fab{position:fixed;right:max(16px,calc((100vw - 620px)/2 + 16px));bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:28px;line-height:1;box-shadow:0 4px 14px #102a4330;cursor:pointer}.overlay{position:fixed;inset:0;background:#071b2b70;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.overlay.open{display:flex}.sheet{width:min(100%,520px);max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;background:#fff;border-radius:16px 16px 12px 12px;padding:10px 12px 12px;box-shadow:0 18px 60px #0004}.sh{display:flex;align-items:center;justify-content:space-between;height:36px}.sh h2{font-size:13px;letter-spacing:.05em;margin:0;color:var(--navy)}label{display:block;font-size:11px;font-weight:700;color:#566675;margin:7px 0 3px}input,select,textarea{width:100%;border:1px solid #ccd7de;border-radius:9px;background:#fff;color:var(--text);padding:8px 9px;font-size:13px;outline:0}input:focus,select:focus,textarea:focus{border-color:#56758d;box-shadow:0 0 0 2px #dce9f0}textarea{min-height:52px;max-height:100px;resize:vertical}.check{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px;font-weight:600}.check input{width:16px;height:16px}.actions{display:flex;align-items:center;gap:7px;margin-top:10px}.actions .spacer{flex:1}.btn{border:1px solid #cbd7df;background:#fff;color:var(--navy);border-radius:9px;min-height:36px;padding:7px 12px;font-size:12px;font-weight:700}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--danger);border-color:transparent;padding-left:0}.settings-section{font-size:10px;font-weight:800;letter-spacing:.08em;color:#7a8792;margin:12px 0 4px}.setting{min-height:42px;border-top:1px solid #edf1f3;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.setting small{display:block;color:var(--muted);margin-top:2px}.setting select{width:auto;min-width:110px;padding:6px}.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#203846;color:#fff;padding:8px 12px;border-radius:18px;font-size:11px;opacity:0;pointer-events:none;transition:.18s;z-index:50}.toast.show{opacity:1}@media(min-width:621px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}.overlay{align-items:center}.sheet{border-radius:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><main class="app"><header class="head"><div class="brand">LIFE RULES</div><button class="icon" id="settingsBtn" aria-label="Settings">⚙</button></header><nav class="tabs"><button class="tab on" data-view="rules">RULES</button><button class="tab" data-view="routines">ROUTINES</button></nav><div class="filters"><button class="filter" data-filter="all">All</button><button class="filter on" data-filter="active">Active</button><button class="filter" data-filter="paused">Paused</button></div><section id="list"></section></main><button class="fab" id="addBtn" aria-label="Add">+</button>
<div class="overlay" id="editOverlay"><form class="sheet" id="editForm"><div class="sh"><h2 id="editTitle">ADD RULE</h2><button type="button" class="icon" id="closeEdit" aria-label="Close">×</button></div><label id="titleLabel">Rule</label><input id="itemTitle" required maxlength="160" autocomplete="off"><div id="routineFields" hidden><label>Frequency</label><input id="frequency" list="freqList" maxlength="50"><datalist id="freqList"><option>Daily</option><option>Weekdays</option><option>Weekly</option><option>Monthly</option><option>As needed</option></datalist><label>When</label><input id="when" maxlength="80" placeholder="10:00 PM, Morning, Before bed"></div><label>Category</label><input id="category" list="catList" maxlength="50"><datalist id="catList"><option>Personal</option><option>Health</option><option>Family</option><option>Home</option><option>Money</option><option>Work</option><option>Mind</option><option>Digital</option></datalist><div id="statusWrap" hidden><label>Status</label><select id="status"><option value="active">Active</option><option value="paused">Paused</option></select></div><label class="check"><input type="checkbox" id="pinned"> Core / Pinned</label><label>Notes</label><textarea id="notes" maxlength="1200" placeholder="Optional"></textarea><div class="actions"><button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button><span class="spacer"></span><button type="button" class="btn" id="cancelEdit">Cancel</button><button class="btn primary" type="submit" id="saveBtn">Add</button></div></form></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="sh"><h2>SETTINGS</h2><button type="button" class="icon" id="closeSettings" aria-label="Close">×</button></div><div class="settings-section">DATA</div><div class="setting"><span>Backup<small>Export all rules, routines and settings</small></span><button class="btn" id="backupBtn">Backup</button></div><div class="setting"><span>Restore<small>Restore a Life Rules JSON backup</small></span><button class="btn" id="restoreBtn">Restore</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div><div class="settings-section">DISPLAY</div><div class="setting"><span>Default view</span><select id="defaultView"><option value="rules">Rules</option><option value="routines">Routines</option></select></div><div class="setting"><span>Show paused by default</span><input type="checkbox" id="showPaused" style="width:18px;height:18px"></div><div class="settings-section">ABOUT</div><div class="setting"><span>Life Rules</span><strong>Version 1.0</strong></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const DB_NAME='LifeRulesDB',DB_VERSION=1;let db,view='rules',filter='active',editingId=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function txDone(tx){return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Transaction aborted'))})}
async function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;for(const n of ['rules','routines'])if(!d.objectStoreNames.contains(n)){const s=d.createObjectStore(n,{keyPath:'id'});['category','status','pinned','updatedAt'].forEach(k=>s.createIndex(k,k,{unique:false}))}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getAll(store){const tx=db.transaction(store,'readonly');return reqP(tx.objectStore(store).getAll())}
async function getOne(store,id){const tx=db.transaction(store,'readonly');return reqP(tx.objectStore(store).get(id))}
async function put(store,obj){const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);await txDone(tx)}
async function del(store,id){const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);await txDone(tx)}
async function setting(key,fallback){const x=await getOne('settings',key);return x?x.value:fallback}
async function setSetting(key,value){await put('settings',{key,value})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sortItems(a,b){if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;return String(a.title).localeCompare(String(b.title),undefined,{sensitivity:'base'})}
async function render(){let items=(await getAll(view)).filter(x=>filter==='all'||x.status===filter).sort(sortItems);const list=$('#list');if(!items.length){const noun=view==='rules'?'rules':'routines',copy=view==='rules'?'Define the principles you want to live by.':'Add the things you want to do repeatedly.';list.innerHTML=`<div class="empty"><strong>No ${noun}${filter==='active'?' active':''} yet.</strong>${copy}<br><button class="btn primary" id="emptyAdd">+ Add ${view==='rules'?'Rule':'Routine'}</button></div>`;$('#emptyAdd').onclick=()=>openEditor();return}list.innerHTML=items.map(x=>{const paused=x.status==='paused'?' · Paused':'';let meta=view==='rules'?(x.category||'Personal'):(x.frequency||'')+(x.frequency&&x.when?' · ':'')+(x.when||'');if(!meta)meta=x.category||'Personal';return `<div class="row" data-id="${esc(x.id)}" tabindex="0"><div class="star">${x.pinned?'★':''}</div><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(meta+paused)}</div></div><div class="chev">›</div></div>`}).join('');$$('.row').forEach(r=>{r.onclick=()=>openEditor(r.dataset.id);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();r.click()}}})}
function syncNav(){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===view));$$('.filter').forEach(b=>b.classList.toggle('on',b.dataset.filter===filter))}
async function openEditor(id=null){editingId=id;const isR=view==='routines';$('#routineFields').hidden=!isR;$('#titleLabel').textContent=isR?'Routine':'Rule';$('#editTitle').textContent=`${id?'EDIT':'ADD'} ${isR?'ROUTINE':'RULE'}`;$('#statusWrap').hidden=!id;$('#deleteBtn').hidden=!id;$('#saveBtn').textContent=id?'Save':'Add';$('#editForm').reset();$('#category').value='Personal';$('#frequency').value='Daily';$('#status').value='active';if(id){const x=await getOne(view,id);if(!x)return;$('#itemTitle').value=x.title||'';$('#category').value=x.category||'Personal';$('#pinned').checked=!!x.pinned;$('#status').value=x.status||'active';$('#notes').value=x.notes||'';if(isR){$('#frequency').value=x.frequency||'';$('#when').value=x.when||''}}$('#editOverlay').classList.add('open');setTimeout(()=>$('#itemTitle').focus({preventScroll:true}),50)}
function closeEditor(){$('#editOverlay').classList.remove('open');editingId=null}
$('#editForm').onsubmit=async e=>{e.preventDefault();const title=$('#itemTitle').value.trim();if(!title)return;try{const old=editingId?await getOne(view,editingId):null,now=Date.now();const obj={id:old?.id||`${view==='rules'?'rule':'routine'}_${crypto.randomUUID()}`,title,category:$('#category').value.trim()||'Personal',pinned:$('#pinned').checked,status:editingId?$('#status').value:'active',notes:$('#notes').value.trim(),createdAt:old?.createdAt||now,updatedAt:now};if(view==='routines'){obj.frequency=$('#frequency').value.trim()||'Daily';obj.when=$('#when').value.trim()}await put(view,obj);closeEditor();await render();toast(editingId?'Saved':'Added')}catch(err){console.error(err);toast('Save failed')}};
$('#deleteBtn').onclick=async()=>{if(!editingId||!confirm('Delete this item?'))return;try{await del(view,editingId);closeEditor();await render();toast('Deleted')}catch(e){toast('Delete failed')}};
$('#addBtn').onclick=()=>openEditor();$('#closeEdit').onclick=$('#cancelEdit').onclick=closeEditor;
$$('.tab').forEach(b=>b.onclick=async()=>{view=b.dataset.view;syncNav();await render()});$$('.filter').forEach(b=>b.onclick=async()=>{filter=b.dataset.filter;syncNav();await render()});
function closeSettings(){$('#settingsOverlay').classList.remove('open')}
$('#settingsBtn').onclick=async()=>{$('#defaultView').value=await setting('defaultView','rules');$('#showPaused').checked=await setting('showPaused',false);$('#settingsOverlay').classList.add('open')};$('#closeSettings').onclick=closeSettings;
$('#defaultView').onchange=async e=>{await setSetting('defaultView',e.target.value);toast('Saved')};$('#showPaused').onchange=async e=>{await setSetting('showPaused',e.target.checked);toast('Saved')};
$('#backupBtn').onclick=async()=>{try{const rules=await getAll('rules'),routines=await getAll('routines'),settingsArr=await getAll('settings'),settings=Object.fromEntries(settingsArr.map(x=>[x.key,x.value]));const data={app:'Life Rules',version:1,exportedAt:new Date().toISOString(),rules,routines,settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`life-rules-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup created')}catch(e){toast('Backup failed')}};
$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='Life Rules'||data.version!==1||!Array.isArray(data.rules)||!Array.isArray(data.routines)||typeof data.settings!=='object'||!data.settings)throw new Error('Invalid backup');for(const arr of [data.rules,data.routines])for(const x of arr)if(!x||typeof x.id!=='string'||typeof x.title!=='string'||!['active','paused'].includes(x.status))throw new Error('Invalid record');if(!confirm(`Restore ${data.rules.length} rules and ${data.routines.length} routines? This replaces current data.`))return;for(const storeName of ['rules','routines','settings']){const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).clear();await txDone(tx)};for(const x of data.rules)await put('rules',x);for(const x of data.routines)await put('routines',x);for(const [key,value] of Object.entries(data.settings))await put('settings',{key,value});view=await setting('defaultView','rules');filter=(await setting('showPaused',false))?'all':'active';syncNav();closeSettings();await render();toast('Restore complete')}catch(err){console.error(err);alert('This file is not a valid Life Rules V1 backup. No data was changed.')}};
for(const o of ['editOverlay','settingsOverlay'])$('#'+o).addEventListener('click',e=>{if(e.target.id===o)o==='editOverlay'?closeEditor():closeSettings()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#editOverlay').classList.contains('open'))closeEditor();else if($('#settingsOverlay').classList.contains('open'))closeSettings()}});
(async()=>{try{db=await openDB();view=await setting('defaultView','rules');filter=(await setting('showPaused',false))?'all':'active';syncNav();await render()}catch(e){console.error(e);document.body.innerHTML='<p style="padding:20px">Life Rules could not open local storage.</p>'}})();
</script></body></html>
